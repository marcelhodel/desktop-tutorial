<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fotobericht</title>
  <meta name="description" content="Fotos aufnehmen, Text diktieren, Berichte offline speichern und exportieren.">
  <meta name="theme-color" content="#0b5f86">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fotobericht">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="bottombar" id="bottombar"></nav>

  <!-- Hidden file inputs for the camera / gallery -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="galleryInput" accept="image/*" multiple hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <dialog id="dialog" class="sheet"></dialog>
  <div id="lightbox" class="lightbox" hidden><img alt=""></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
